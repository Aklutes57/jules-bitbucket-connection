# OPTIONAL: near-instant sync instead of waiting for the 15-minute poll.
#
# Bitbucket webhooks cannot send the Authorization header GitHub requires,
# but Bitbucket Pipelines can call the GitHub API directly. Copy this file
# to the ROOT of your Bitbucket repo as `bitbucket-pipelines.yml` (or merge
# the step into your existing pipeline), enable Pipelines in the repo
# settings, and add two repository variables
# (Repository settings > Pipelines > Repository variables):
#
#   GITHUB_BRIDGE_REPO   e.g. "your-github-user/jules-bitbucket-connection"
#   GITHUB_SYNC_PAT      (SECURED) a GitHub fine-grained PAT that only has
#                        Contents: Read and write on the bridge repo —
#                        that is enough to fire repository_dispatch. Don't
#                        reuse your MIRROR_GITHUB_PAT here.
#
# Every push then triggers the bridge's sync workflow within seconds.
# Uses a few seconds of your Pipelines minutes per push (free tier: 50
# min/month). The scheduled poll still runs as a safety net.

image: atlassian/default-image:4

pipelines:
  default:
    - step:
        name: Trigger Jules bridge sync on GitHub
        max-time: 5
        script:
          - >
            curl -sf -X POST
            -H "Authorization: Bearer $GITHUB_SYNC_PAT"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
            "https://api.github.com/repos/$GITHUB_BRIDGE_REPO/dispatches"
            -d '{"event_type":"bitbucket-sync"}'
